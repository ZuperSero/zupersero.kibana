---
- name: Install repository dependencies
  ansible.builtin.dnf:
    name:
      - gnupg2
      - python3-dnf-plugin-versionlock
    state: present

- name: Import the Elastic signing key
  ansible.builtin.rpm_key:
    state: present
    key: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    fingerprint: 46095ACC8548582C1A2699A9D27D666CD88E42B4

- name: Add the Elastic repository
  ansible.builtin.yum_repository:
    name: "elastic-{{ kibana_major_version }}.x"
    description: "Elastic repository for {{ kibana_major_version }}.x packages"
    baseurl: "https://artifacts.elastic.co/packages/{{ kibana_major_version }}.x/yum"
    gpgcheck: true
    gpgkey: https://artifacts.elastic.co/GPG-KEY-elasticsearch

- name: Install Kibana
  ansible.builtin.dnf:
    name: "kibana-{{ kibana_version }}"
    state: present
    allow_downgrade: "{{ kibana_allow_downgrade }}"
