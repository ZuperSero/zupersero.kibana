---
kibana_version: "9.2.1"
kibana_allow_downgrade: false
kibana_download_timeout: 30
kibana_package_install_timeout: 1800
kibana_user: kibana
kibana_group: kibana
kibana_config_path: /etc/kibana
kibana_systemd_service_overrides: ""
kibana_config_content:
  server.host: "0.0.0.0"
  server.port: 5601
  elasticsearch.hosts:
    - "http://localhost:9200"
