---
- name: Exercise enrollment-token lifecycle
  vars: {item_name: phase1-enrollment-token}
  module_defaults:
    zupersero.kibana.enrollment_token:
      url: http://127.0.0.1:5601
      username: elastic
      password: changeme
  block:
    - name: Create temporary agent policy
      zupersero.kibana.agent_policy:
        name: phase1-enrollment-agent-policy
        namespace: phase1
        url: http://127.0.0.1:5601
        username: elastic
        password: changeme
      register: agent_policy

    - zupersero.kibana.enrollment_token:
        name: "{{ item_name }}"
        policy_id: "{{ agent_policy.agent_policy.id }}"
      check_mode: true
      register: preview
    - ansible.builtin.assert: {that: [preview is changed]}
    - zupersero.kibana.enrollment_token:
        name: "{{ item_name }}"
        policy_id: "{{ agent_policy.agent_policy.id }}"
      register: created
    - ansible.builtin.assert:
        that: [created is changed, created.enrollment_token.id is defined, created.enrollment_token.api_key == 'VALUE_SPECIFIED_IN_NO_LOG_PARAMETER']
    - zupersero.kibana.enrollment_token:
        id: "{{ created.enrollment_token.id }}"
        state: absent
      register: deleted
    - ansible.builtin.assert: {that: [deleted is changed]}
  always:
    - zupersero.kibana.enrollment_token:
        id: "{{ created.enrollment_token.id | default('') }}"
        state: absent
      when: created is defined and created.enrollment_token.id is defined
    - name: Remove temporary agent policy
      zupersero.kibana.agent_policy:
        id: "{{ agent_policy.agent_policy.id | default('') }}"
        state: absent
        force: true
        url: http://127.0.0.1:5601
        username: elastic
        password: changeme
      when: agent_policy is defined and agent_policy.agent_policy.id is defined
