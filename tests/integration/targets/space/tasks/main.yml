---
- name: Test space module
  module_defaults:
    zupersero.kibana.space:
      url: http://localhost:5601
      username: elastic
      password: changeme

  block:
    - name: Create space in check mode
      zupersero.kibana.space:
        id: test-integration-space
        name: Test Integration Space
        description: Space for integration testing
        state: present
      check_mode: true
      register: create_check

    - name: Assert check mode create shows changed
      ansible.builtin.assert:
        that:
          - create_check is changed
          - create_check.space.id == 'test-integration-space'
          - create_check.space.name == 'Test Integration Space'

    - name: Create space
      zupersero.kibana.space:
        id: test-integration-space
        name: Test Integration Space
        description: Space for integration testing
        disabled_features:
          - canvas
        state: present
      register: create_result

    - name: Assert space was created
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.space.id == 'test-integration-space'
          - create_result.space.name == 'Test Integration Space'
          - create_result.space.description == 'Space for integration testing'
          - create_result.space.disabledFeatures == ['canvas']

    - name: Create space again (should not change)
      zupersero.kibana.space:
        id: test-integration-space
        name: Test Integration Space
        description: Space for integration testing
        disabled_features:
          - canvas
        state: present
      register: create_again

    - name: Assert space was not changed
      ansible.builtin.assert:
        that:
          - create_again is not changed
          - create_again.space.id == 'test-integration-space'

    - name: Update space in check mode
      zupersero.kibana.space:
        id: test-integration-space
        name: Test Integration Space Updated
        description: Updated description for testing
        disabled_features:
          - canvas
          - maps
        state: present
      check_mode: true
      register: update_check

    - name: Assert check mode update shows changed
      ansible.builtin.assert:
        that:
          - update_check is changed

    - name: Update space
      zupersero.kibana.space:
        id: test-integration-space
        name: Test Integration Space Updated
        description: Updated description for testing
        disabled_features:
          - canvas
          - maps
        state: present
      register: update_result

    - name: Assert space was updated
      ansible.builtin.assert:
        that:
          - update_result is changed
          - update_result.space.name == 'Test Integration Space Updated'
          - update_result.space.description == 'Updated description for testing'
          - "'canvas' in update_result.space.disabledFeatures"
          - "'maps_v2' in update_result.space.disabledFeatures"

    - name: Update space again (should not change)
      zupersero.kibana.space:
        id: test-integration-space
        name: Test Integration Space Updated
        description: Updated description for testing
        disabled_features:
          - canvas
          - maps
        state: present
      register: update_again

    - name: Assert space was not changed
      ansible.builtin.assert:
        that:
          - update_again is not changed

    - name: Delete space in check mode
      zupersero.kibana.space:
        id: test-integration-space
        state: absent
      check_mode: true
      register: delete_check

    - name: Assert check mode delete shows changed
      ansible.builtin.assert:
        that:
          - delete_check is changed
          - delete_check.space.id == 'test-integration-space'

    - name: Delete space
      zupersero.kibana.space:
        id: test-integration-space
        state: absent
      register: delete_result

    - name: Assert space was deleted
      ansible.builtin.assert:
        that:
          - delete_result is changed
          - delete_result.space.id == 'test-integration-space'
          - delete_result.space.name == 'Test Integration Space Updated'

    - name: Delete space again (should not change)
      zupersero.kibana.space:
        id: test-integration-space
        state: absent
      register: delete_again

    - name: Assert space deletion was idempotent
      ansible.builtin.assert:
        that:
          - delete_again is not changed

    - name: Create space with custom appearance
      zupersero.kibana.space:
        id: test-appearance-space
        name: Appearance Test Space
        description: Testing custom appearance fields
        color: "#FF6600"
        initials: AT
        solution: classic
        state: present
      register: appearance_result

    - name: Assert space with custom appearance was created
      ansible.builtin.assert:
        that:
          - appearance_result is changed
          - appearance_result.space.id == 'test-appearance-space'
          - appearance_result.space.name == 'Appearance Test Space'
          - appearance_result.space.color == '#FF6600'
          - appearance_result.space.initials == 'AT'
          - appearance_result.space.solution == 'classic'

    - name: Create space with custom appearance again (should not change)
      zupersero.kibana.space:
        id: test-appearance-space
        name: Appearance Test Space
        description: Testing custom appearance fields
        color: "#FF6600"
        initials: AT
        solution: classic
        state: present
      register: appearance_again

    - name: Assert space was not changed
      ansible.builtin.assert:
        that:
          - appearance_again is not changed

    - name: Update appearance fields
      zupersero.kibana.space:
        id: test-appearance-space
        name: Appearance Test Space Updated
        description: Updated appearance
        color: "#0000FF"
        initials: AU
        solution: security
        state: present
      register: appearance_update

    - name: Assert appearance was updated
      ansible.builtin.assert:
        that:
          - appearance_update is changed
          - appearance_update.space.name == 'Appearance Test Space Updated'
          - appearance_update.space.color == '#0000FF'
          - appearance_update.space.initials == 'AU'
          - appearance_update.space.solution == 'security'

    - name: Delete appearance test space
      zupersero.kibana.space:
        id: test-appearance-space
        state: absent
      register: appearance_delete

    - name: Assert appearance test space was deleted
      ansible.builtin.assert:
        that:
          - appearance_delete is changed

  always:
    - name: Cleanup - ensure test space is deleted
      zupersero.kibana.space:
        id: test-integration-space
        state: absent
      failed_when: false

    - name: Cleanup - ensure appearance test space is deleted
      zupersero.kibana.space:
        id: test-appearance-space
        state: absent
      failed_when: false
