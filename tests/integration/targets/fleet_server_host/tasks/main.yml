---
- name: Exercise Fleet Server host lifecycle
  vars: {item_name: phase1-fleet-server-host}
  module_defaults:
    zupersero.kibana.fleet_server_host:
      url: http://127.0.0.1:5601
      username: elastic
      password: changeme
  block:
    - zupersero.kibana.fleet_server_host:
        name: "{{ item_name }}"
        host_urls: [http://fleet-server:8220]
      check_mode: true
      register: preview
    - ansible.builtin.assert: {that: [preview is changed]}
    - zupersero.kibana.fleet_server_host:
        name: "{{ item_name }}"
        host_urls: [http://fleet-server:8220]
      register: created
    - ansible.builtin.assert: {that: [created is changed, created.fleet_server_host.id is defined]}
    - zupersero.kibana.fleet_server_host:
        id: "{{ created.fleet_server_host.id }}"
        name: "{{ item_name }}"
        host_urls: [http://fleet-server:8220]
      register: again
    - ansible.builtin.assert: {that: [again is not changed]}
    - zupersero.kibana.fleet_server_host:
        id: "{{ created.fleet_server_host.id }}"
        state: absent
      register: deleted
    - ansible.builtin.assert: {that: [deleted is changed]}
  always:
    - zupersero.kibana.fleet_server_host:
        id: "{{ created.fleet_server_host.id | default('') }}"
        state: absent
      when: created is defined and created.fleet_server_host.id is defined
