---
- name: Exercise Agent download-source lifecycle
  vars: {item_name: phase1-agent-download-source}
  module_defaults:
    zupersero.kibana.agent_download_source:
      url: http://127.0.0.1:5601
      username: elastic
      password: changeme
  block:
    - zupersero.kibana.agent_download_source:
        name: "{{ item_name }}"
        host: https://artifacts.example.test/agent
      check_mode: true
      register: preview
    - ansible.builtin.assert: {that: [preview is changed]}
    - zupersero.kibana.agent_download_source:
        name: "{{ item_name }}"
        host: https://artifacts.example.test/agent
      register: created
    - ansible.builtin.assert: {that: [created is changed, created.agent_download_source.id is defined]}
    - zupersero.kibana.agent_download_source:
        id: "{{ created.agent_download_source.id }}"
        name: "{{ item_name }}"
        host: https://artifacts.example.test/agent
      register: again
    - ansible.builtin.assert: {that: [again is not changed]}
    - zupersero.kibana.agent_download_source:
        id: "{{ created.agent_download_source.id }}"
        state: absent
      register: deleted
    - ansible.builtin.assert: {that: [deleted is changed]}
  always:
    - zupersero.kibana.agent_download_source:
        id: "{{ created.agent_download_source.id | default('') }}"
        state: absent
      when: created is defined and created.agent_download_source.id is defined
