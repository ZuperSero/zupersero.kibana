name: Unit Tests
on:
    pull_request:
        branches: [main]
        paths: ['plugins/**', 'tests/unit/**', '.github/workflows/ansible-test-unit.yml', 'justfile']
    push:
        branches: [dev]
        paths: ['plugins/**', 'tests/unit/**', '.github/workflows/ansible-test-unit.yml', 'justfile']

jobs:
    ansible-test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                # Keep this list editable; unit coverage runs on every Python version.
                python: ['3.11', '3.12', '3.13']
                ansible_core: ['2.19.5']
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python ${{ matrix.python }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}
            - name: Install test dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install "ansible-core==${{ matrix.ansible_core }}" coverage passlib
            - name: Run unit tests
              run: ansible-test units --coverage
            - name: Generate coverage report
              if: always()
              run: |
                  ansible-test coverage combine || true
                  ansible-test coverage report --include 'plugins/*' || true
