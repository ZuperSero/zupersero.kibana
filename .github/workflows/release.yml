name: Publish to Ansible Galaxy

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: galaxy-publish-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible Galaxy tooling
        run: python -m pip install --disable-pip-version-check --no-cache-dir ansible-core

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          galaxy_version="$(python -c 'import pathlib, sys, yaml; print(yaml.safe_load(pathlib.Path("galaxy.yml").read_text())["version"])')"
          if [[ "$RELEASE_TAG" != "$galaxy_version" ]]; then
            echo "Release tag does not match galaxy.yml version (tag: $RELEASE_TAG, version: $galaxy_version)." >&2
            exit 1
          fi
          echo "Publishing zupersero.kibana version $galaxy_version."

      - name: Build collection artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          existing=(zupersero-kibana-*.tar.gz)
          if (( ${#existing[@]} != 0 )); then
            echo "A pre-existing collection artifact was found; refusing to publish an ambiguous build." >&2
            exit 1
          fi
          ansible-galaxy collection build --force
          artifacts=(zupersero-kibana-*.tar.gz)
          if (( ${#artifacts[@]} != 1 )); then
            echo "Expected exactly one collection artifact, found ${#artifacts[@]}." >&2
            exit 1
          fi
          galaxy_version="$(python -c 'import pathlib, sys, yaml; print(yaml.safe_load(pathlib.Path("galaxy.yml").read_text())["version"])')"
          expected="zupersero-kibana-${galaxy_version}.tar.gz"
          if [[ "${artifacts[0]}" != "$expected" ]]; then
            echo "Built artifact does not match galaxy.yml version." >&2
            exit 1
          fi
          echo "GALAXY_ARTIFACT=${artifacts[0]}" >> "$GITHUB_ENV"

      - name: Publish collection
        run: |
          set -euo pipefail
          if [[ -z "${GALAXY_API_KEY:-}" ]]; then
            echo "GALAXY_API_KEY is not configured for this repository." >&2
            exit 1
          fi
          ansible-galaxy collection publish "$GALAXY_ARTIFACT" \
            --server https://galaxy.ansible.com/api/ \
            --api-key "$GALAXY_API_KEY"
