---
name: Molecule Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "extensions/**"
      - "roles/**"
      - "galaxy.yml"
      - ".github/workflows/molecule.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "extensions/**"
      - "roles/**"
      - "galaxy.yml"
      - ".github/workflows/molecule.yml"

jobs:
  discover-scenarios:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.scenarios.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover Molecule scenarios
        id: scenarios
        run: |
          scenarios=$(find extensions/molecule -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -R -s -c 'split("\n")[:-1]')
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"

  molecule:
    needs: discover-scenarios
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.discover-scenarios.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.19.5 molecule "molecule-plugins[docker]"
      - name: Build and install the collection
        run: |
          ansible-galaxy collection build
          ansible-galaxy collection install zupersero-kibana-*.tar.gz
          ansible-galaxy collection install community.docker community.general
      - name: Run Molecule
        working-directory: extensions
        env:
          ANSIBLE_FORKS: "1"
        run: molecule test --scenario-name "${{ matrix.scenario }}"
